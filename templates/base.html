<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Міні-бібліотека{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Навігаційна панель -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/books/">📚 Міні-бібліотека</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/books/">Книги</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/" target="_blank">Адмінка</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Основний контейнер для вмісту кожної сторінки -->
    <div class="container mb-5">
        {% block content %}
        <!-- Сюди кожна окрема сторінка підставлятиме свій вміст -->
        {% endblock %}
    </div>

</body>
</html>
