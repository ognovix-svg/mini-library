services:
  db:
    image: postgres:16-alpine
    container_name: mini_library_db
    restart: always
    environment:
      POSTGRES_DB: mini_library
      POSTGRES_USER: boss
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  web:
    build: .
    container_name: mini_library_web
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=mini_library
      - DB_USER=boss
      - DB_PASSWORD=postgrespassword
      - DB_PORT=5432
    depends_on:
      - db

volumes:
  postgres_data:
